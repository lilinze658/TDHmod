 ZHI_Zhang_Haigui: "张海桂"
 PORTRAIT_ZHI_ZHANG_HAIGUI_DESC: "§Y生于：§L§!\n种族：§L人类§!\n背景：§L神州西卫致远军统领，人类。张海桂曾前往莫比斯国家军事学院学习，作战方式和行为举止都有一层厚厚的莫比斯色彩，但这并不影响她为神州的安定做出贡献。致远军以白虎为标志，镇守神州西部边境线，是神州和西部大陆最主要的连接点。曾经的致远军能够纵横中洲靠的就是快速的压倒性攻势，而了解西洲大陆作战风格的张海桂在原先的理论基础上进行改进，让致远军拥有更强大的突击应对力量。§!§!"
 ZHI_ZHANG_HAIGUI_GENERAL_DESC: "$PORTRAIT_ZHI_ZHANG_HAIGUI_DESC$"
 ZHI_Gu_Qing: "孤晴"
 ZHI_Gu_Qing_GENERAL_DESC: "§Y生于：§L§!\n种族：§L人类§!\n背景：§L神州西卫致远军海军指挥官，亚人类。带领西卫海军巡视神州边界，堤防西方大陆军队的动向。§!§!"

 WEI_Yuan_Fuxi: "袁芙茜"
 PORTRAIT_WEI_Yuan_Fuxi_DESC: "§Y生于：§L§!\n种族：§L人类§!\n背景：§L神州北卫凛冬军统领，人类。凛冬军以玄武为标志，镇守神州北部海岸线和神州外岛，同时监视在西北部的安息之国。作为一方统领，袁芙茜深知神州外部并不平稳，一股强大的浪潮即将来临。但北方的寒冷练就了强大的凛冬军，滚滚的铁甲洪流和破冰前行的凛冬海军会证明自己的强大。§!§!"
 WEI_Yuan_Fuxi_GENERAL_DESC: "$PORTRAIT_WEI_Yuan_Fuxi_DESC$"
 WEI_Gui_Lin: "桂琳"
 WEI_Gui_Lin_GENERAL_DESC: "§Y生于：§L§!\n种族：§L人类§!\n背景：§L神州北卫凛冬军炮兵指挥官，人类。入伍前是一位探险家，现在是凛冬军的炮兵将领，负责镇守神州北部边界。§!§!"
 WEI_Lin_Fang: "林芳"
 WEI_Lin_Fang_GENERAL_DESC: "§Y生于：§L§!\n种族：§L人类§!\n背景：§L神州北卫凛冬军海军指挥官，人类。并不十分健谈，但作战指挥时情绪会变得十分高昂。喜欢坐在舰桥上看着窗外下着的细雪。§!§!"
 WEI_Pa_Zhen: "帕真"
 WEI_Pa_Zhen_GENERAL_DESC: "§Y生于：§L§!\n种族：§L亚人§!\n背景：§L神州北洋舰队指挥官，亚人类。从小在北方长大，与林芳是要好的朋友，喜爱看书。§!§!"

 ONG_Shao_Xuan: "邵宣"
 PORTRAIT_ONG_Shao_Xuan_DESC: "§Y生于：§L§!\n种族：§L人类§!\n背景：§L神州东卫定洋军统领，人类。定洋军以青龙为标志，镇守神州东部的海岸线。定洋军的统领邵宣曾带领定洋军击退企图叛乱的阳洁羽等人，平定了东部的叛乱。曾以为此事就告一段落，可谁知升阳帝国的出现又打破了和平的现状。面对拥有未知装备的升阳帝国，邵宣和她的定洋军已经做好了准备誓死捍卫神州边境的安全。§!§!"
 ONG_Shao_Xuan_GENERAL_DESC: "$PORTRAIT_ONG_Shao_Xuan_DESC$"
 ONG_Ya_Mu: "雅木"
 ONG_Ya_Mu_GENERAL_DESC: "§Y生于：§L§!\n种族：§L人类§!\n背景：§L神州东卫定洋军陆军指挥官，人类。曾前往洛维尼亚皇家军事学院学习，归国之后担任装甲兵参谋调往定洋军。在以海军为主要战斗力量的定洋军中，雅木对于发展装甲部队的提议经常会被忽视，同僚曾劝她跳槽到重视陆军的凛冬军或致远军，但她都一一谢绝了，在她眼里，装甲兵是现代战争不可或缺的一部分，装甲力量薄弱的定洋军更需要发展装甲部队。在雅木不懈的努力下，定洋军装甲部队规模慢慢的有了起色，同时还总结出一套后勤保障体系，让定洋军的后勤系统变得更加稳固。§!§!"
 ONG_Qing_Yun: "青云"
 ONG_Qing_Yun_GENERAL_DESC: "§Y生于：§L§!\n种族：§L人类§!\n背景：§L神州东卫定洋军海军指挥官，人类。曾参与了平定阳洁羽乱党的镇压行动。主张战舰航母协同作战，认为航母将与战列舰一样成为未来海战不可或缺的力量。§!§!"
 ONG_Chen_Lingjing: "陈玲静"
 ONG_Chen_Lingjing_GENERAL_DESC: "§Y生于：§L§!\n种族：§L人类§!\n背景：§L神州东卫定洋军航空指挥官，人类。与青云是要好的朋友，两人在对航母的运用上有着不同的看法。陈玲静认为航母能代替战列舰成为海上的战斗主力，提议军械部应当将研发重点放在小型舰艇与舰载飞机上。§!§!"

 NAN_An_Jingzhi: "安靖之"
 PORTRAIT_NAN_An_Jingzhi_DESC: "§Y生于：§L§!\n种族：§L人类§!\n背景：§L神州南卫安平军陆军指挥官，西洲裔，人类。安靖之对火炮的战术理解使她在一众军官中脱颖而出，现在的她隶属于神州南卫安平军，可在需要的时刻调动精锐炮兵部队支援致远军和定洋军。§!§!"
 NAN_An_Jingzhi_GENERAL_DESC: "$PORTRAIT_NAN_An_Jingzhi_DESC$"
 NAN_Xia_Li: "夏莉"
 NAN_Xia_Li_GENERAL_DESC: "§Y生于：§L§!\n种族：§L人类§!\n背景：§L神州陆军将领。作战勇猛，为人正直。对一切事物充满好奇，帮助过朱秋撰写游记。§!§!"

 GOD_Jie_Yi: "洁依"
 PORTRAIT_GOD_Jie_Yi_DESC: "§Y生于：§L§!\n种族：§L鬼族§!\n背景：§L神州洛神港最高管理者，东国鬼族。与其他鬼族血红色的眼睛不同，洁依拥有淡蓝色的眼睛，这使得她被自己的家乡抛弃，幸运的是，她被洛神港商队捡到并抚养长大。在洛神港熏陶长大的洁依展现出了出众的商业才能和指挥能力，她靠着实力一步步的走到了今天的位置。曾经被视为不详之兆的她用自己的行动赢得了尊重，同时也背负着责任。连通各国的洛神港商业航线是神州与外界交流的重要渠道，同时也是神州海上补给的重要枢纽。如何安然度过即将到来的风暴，是洁依和洛神港将要面临的挑战。§!§!"
 GOD_Bin_Hui: "彬惠"
 GOD_Bin_Hui_ADVISOR_DESC: "§Y生于：§L§!\n种族：§L亚人§!\n背景：§L神州洛神港管理者，亚人类。在繁忙的洛神港中协助洁依管理船只的统计和进出，是洁依的左右手。§!§!"

 ANY_Qing_Ji: "青姬"
 PORTRAIT_ANY_Qing_Ji_DESC: "§Y生于：§L§!\n种族：§L亚人§!\n背景：§L安阳国战士，亚人类。交界群岛原住民，为了更加合群而佩戴般若面具。§!§!"
 ANY_Qing_Ji_GENERAL_DESC: "$PORTRAIT_ANY_Qing_Ji_DESC$"
 ANY_Mie_Yazi: "咩亚子"
 ANY_Mie_Yazi_ADVISOR_DESC: "§Y生于：§L§!\n种族：§L人类§!\n背景：§L安阳国偶像，人类。野奈雅的妹妹，梦想是能够前往神州大陆的舞台上演出。§!§!"
 ANY_Xiao_Die: "咲蝶"
 ANY_Xiao_Die_GENERAL_DESC: "§Y生于：§L§!\n种族：§L妖族§!\n背景：§L安阳国海军将领，东国妖族。擅长通灵的年轻妖族，会使用火焰法术协助战斗。§!§!"

