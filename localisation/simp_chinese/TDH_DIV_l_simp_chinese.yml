 PORTRAIT_DIV_ZHU_QIU_DESC: "§Y生于：§L不可考§!\n种族：§L亡灵§!\n背景：§L神州领袖，神州禁卫军总指挥，亡灵族。禁卫军是独立于中央军和边境四军团的存在，人员都经过重重选拔，有多大规模尚不明确，外界只是知道禁卫军主要活动范围在神州各大城市附近，传说是“天子”的御用军队，不过这终究只是传说罢了。作为最经常出现在大众面前的禁卫军人员，神州民众对她最大的印象可能就是雷厉风行和铁面无私。关于身为亡灵族的朱秋是怎么成为神州的最高统治者的？恐怕只能在古老的藏书阁中寻找答案，而朱秋自己也已经把这过往烂在了心里。现在的她只有一个职责，就是用自己不老不死的身体与无穷无尽的寿命守卫神州的安宁。§!§!"
 DIV_ZHANG_XIKAI_GENERAL_DESC: "§Y生于：§L§!\n种族：§L人类§!\n背景：§L神州中央军元帅，人类。作为中央军的元帅，张希凯的职责乃是重中之重。神州中部地区作为皇室重地，无论是军事还是人事方面，都要做到几乎严丝无缝。正是有像张希凯这类忠诚的将军，才可保神州经历千年而不被撼动。§!§!"
 DIV_AN_BAI_SCIENTIST_DESC: "§Y生于：§L§!\n种族：§L鬼族§!\n背景：§L神州工程专家，东国鬼族。擅长结构研究的少女，设计了多款实用的坦克型号，为神州的国防工业做出了杰出贡献。§!§!"
 DIV_WANG_HUACAI_ADVISOR_DESC: "§Y生于：§L§!\n种族：§L人类§!\n背景：§L神州海军指挥官，神州海军指挥学院院长，人类。擅长指挥多个舰队进行机动作战，注重海军后勤理论，在与升阳帝国的战争中策划了多场针对其补给航线的行动。§!§!"
 DIV_WANG_HUACAI_GENERAL_DESC: "$DIV_WANG_HUACAI_ADVISOR_DESC$"
 DIV_HUANG_BEIYA_ADVISOR_DESC: "§Y生于：§L§!\n种族：§L人类§!\n背景：§L神州陆军将领。吕治岚的参谋长，顽强而有活力。虽不能独自一人指挥军队，但是个十分优秀的助手。§!§!"
 DIV_LV_ZHILAN_GENERAL_DESC: "§Y生于：§L§!\n种族：§L亚人§!\n背景：§L神州第一位亚人类元帅，性格鲁莽却又平易近人。曾亲自为前线军队筹备物资，深受基层士兵爱戴。§!§!"
 DIV_SU_LUONA_GENERAL_DESC: "§Y生于：§L§!\n种族：§L人类§!\n背景：§L神州陆军将领。曾因与阳洁羽交好而遭到革职流放，后在与升阳帝国的战争中被重新起用。成功在贡觉、福泉、赤河战役中击败升阳军，多次营救在后方作战的民兵游击队并撤退。战争结束后晋升为神州元帅。§!§!"
 DIV_JIANG_NAYU_ADVISOR_DESC: "§Y生于：§L§!\n种族：§L人类§!\n背景：§L神州中央国防科技学院院长，人类。负责调度陆军装备的列装与研发工作，她的研究团队在与升阳帝国的战争中发挥着重要作用。§!§!"
 
 
 DIV_crown_regent: "摄政王"
 